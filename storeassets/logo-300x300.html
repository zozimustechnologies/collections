<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 300px; height: 300px; overflow: hidden; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  svg { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35)); }
</style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="300" height="300" fill="none">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#3d7ea6"/>
        <stop offset="100%" stop-color="#1a4a6e"/>
      </linearGradient>
      <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(26,74,110,0.4)"/>
      </filter>
    </defs>
    <rect width="200" height="200" rx="40" fill="url(#bg)"/>
    <rect width="200" height="200" rx="40" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.12"/>
    <path d="M6 0 L26 0 Q32 0 32 6 L32 66 L16 55 L0 66 L0 6 Q0 0 6 0 Z" fill="white" fill-opacity="0.3" transform="translate(41 70)"/>
    <path d="M6 0 L26 0 Q32 0 32 6 L32 66 L16 55 L0 66 L0 6 Q0 0 6 0 Z" fill="white" fill-opacity="0.3" transform="translate(127 70)"/>
    <path d="M6 0 L26 0 Q32 0 32 6 L32 84 L16 70 L0 84 L0 6 Q0 0 6 0 Z" fill="white" filter="url(#soft)" transform="translate(84 52)"/>
    <rect x="90" y="69" width="20" height="3.5" rx="1.75" fill="#2d6a8f" opacity="0.55"/>
    <rect x="90" y="78" width="14" height="3" rx="1.5" fill="#2d6a8f" opacity="0.4"/>
    <rect x="90" y="86" width="18" height="3.5" rx="1.75" fill="#2d6a8f" opacity="0.55"/>
    <rect x="90" y="95" width="12" height="3" rx="1.5" fill="#2d6a8f" opacity="0.4"/>
    <rect x="90" y="103" width="16" height="3.5" rx="1.75" fill="#2d6a8f" opacity="0.55"/>
    <circle cx="100" cy="62" r="3" fill="#3d7ea6" opacity="0.5"/>
  </svg>
</body>
</html>
